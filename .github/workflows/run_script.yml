name: Run Eways Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'  # هر 20 دقیقه

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Debug hosts and connectivity
      run: |
        echo "=== HOSTS FILE ==="
        cat /etc/hosts

        echo ""
        echo "=== CURL TO WOO IP DIRECT ==="
        curl -4 -v --connect-timeout 10 --max-time 15 \
          --resolve "www.pakhshemobile.ir:443:195.28.10.107" \
          https://www.pakhshemobile.ir/ || true

        echo ""
        echo "=== PING WOO IP DIRECT ==="
        ping -c 3 195.28.10.107 || true

        echo ""
        echo "=== CURL WOO WITHOUT SNI ==="
        curl -4 -v --connect-timeout 10 --max-time 15 \
          https://195.28.10.107/ -k \
          -H "Host: www.pakhshemobile.ir" || true

    - name: Override DNS for eways
      run: |
        echo "${{ vars.EWAYS_PANEL_IP }} panel.eways.co" | sudo tee -a /etc/hosts > /dev/null
        echo "✅ Eways hosts entry added."

    - name: Override DNS for Woo
      run: |
        echo "${{ vars.WC_SITE_IP }} www.pakhshemobile.ir pakhshemobile.ir" | sudo tee -a /etc/hosts > /dev/null
        echo "✅ Woo hosts entry added."

    - name: Test Eways Connection
      run: |
        echo "--- Eways test ---"
        curl -4 -I -L --connect-timeout 10 --max-time 20 https://panel.eways.co || true

    - name: Test Woo Connection
      run: |
        echo "--- Woo root ---"
        curl -4 -I -L --connect-timeout 10 --max-time 20 https://www.pakhshemobile.ir || true

        echo "--- Woo wp-json ---"
        curl -4 -I -L --connect-timeout 10 --max-time 20 https://www.pakhshemobile.ir/wp-json/ || true

        echo "--- Woo wc api ---"
        curl -4 -I -L --connect-timeout 10 --max-time 20 https://www.pakhshemobile.ir/wp-json/wc/v3 || true

    # -------------------------------
    # PRODUCTS CACHE
    # -------------------------------

    - name: Prepare cache files
      run: |
        if [ ! -s products_cache.json ]; then
          echo '{}' > products_cache.json
          echo "✅ Cache file created/reset to empty JSON object."
        else
          echo "✅ Existing products cache file found."
        fi

        if [ ! -s unavailable_confirm.json ]; then
          echo '{}' > unavailable_confirm.json
          echo "✅ Confirm-state file created."
        else
          echo "✅ Existing confirm-state file found."
        fi

    - name: Restore products cache
      id: restore-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          products_cache.json
          unavailable_confirm.json
        key: products-cache-${{ github.run_id }}
        restore-keys: |
          products-cache-

    - name: Verify products cache
      run: |
        echo "=== PRODUCTS CACHE ==="
        ls -lh products_cache.json unavailable_confirm.json || true

    # -------------------------------
    # PYTHON
    # -------------------------------

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 tqdm tenacity lxml certifi urllib3

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    # -------------------------------
    # RUN BOT
    # -------------------------------

    - name: Run script
      env:
        WC_API_URL: ${{ secrets.WC_API_URL }}
        WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
        WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
        EWAYS_USERNAME: ${{ secrets.EWAYS_USERNAME }}
        EWAYS_PASSWORD: ${{ secrets.EWAYS_PASSWORD }}
        SELECTED_IDS_STRING: "1582:21151-allz,1584-all-allz|16777:all-allz|4882:all-allz|16778:22570-all-allz"
        # فیلتر موجودی (فقط محصولات موجود از منبع)
        ONLY_AVAILABLE_FETCH: "true"
        HTML_NO_COUNT_FILTER: "true"
        SKIP_ZERO_PRICE: "true"
        DETAIL_AVAILABLE_GUARD: "true"
        # تصاویر
        MAX_IMAGES_PER_PRODUCT: "5"
        DEAD_IMAGE_CHECK: "true"
        GALLERY_BACKFILL: "true"
        MAX_IMAGE_UPDATES_PER_RUN: "40"
        IMAGES_REPLACE_FOREIGN: "true"
        # ناموجود/حذف
        UNAVAILABLE_MODE: "delete"
        UNAVAILABLE_CONFIRM_RUNS: "2"
        DELETE_ABSENT_FROM_SOURCE: "true"
        WP_MEDIA_DELETE: "true"
      run: python main.py

    # -------------------------------
    # SAVE CACHE
    # -------------------------------

    - name: Save products cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          products_cache.json
          unavailable_confirm.json
        key: products-cache-${{ github.run_id }}

    # -------------------------------
    # LOGS
    # -------------------------------

    - name: Print logs for debugging
      if: always()
      run: |
        echo "=== APP LOG ==="
        cat app.log || true

        echo ""
        echo "=== CACHE FILES ==="
        ls -lh products_cache.json unavailable_confirm.json || true
