name: Run Eways Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'  # هر 20 دقیقه

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Override DNS for eways
      run: |
        echo "79.175.182.57 panel.eways.co" | sudo tee -a /etc/hosts
        echo "✅ Hosts file updated:"
        grep eways /etc/hosts

    - name: Connection Test
      run: |
        echo "--- Testing Ping ---"
        ping -c 3 panel.eways.co || true
        echo "--- Testing HTTPS Connection ---"
        curl -v --max-time 15 https://panel.eways.co || true

    - name: Prepare cache file
      run: |
        touch products_cache.json

    - name: Cache products JSON
      uses: actions/cache@v4
      with:
        key: products-cache-${{ hashFiles('products_cache.json') }}
        restore-keys: |
          products-cache-
        path: products_cache.json

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 tqdm tenacity lxml certifi urllib3
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run script
      env:
        WC_API_URL: ${{ secrets.WC_API_URL }}
        WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
        WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
        EWAYS_USERNAME: ${{ secrets.EWAYS_USERNAME }}
        EWAYS_PASSWORD: ${{ secrets.EWAYS_PASSWORD }}
        SELECTED_IDS_STRING: "1582:21151-allz,1584-all-allz|16777:all-allz|4882:all-allz|16778:22570-all-allz"
      run: python main.py

    - name: Print logs for debugging
      if: always()
      run: cat app.log || true
